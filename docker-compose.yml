version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: algotrader-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: algotrader
      MYSQL_USER: algotrader
      MYSQL_PASSWORD: algotrader
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - algotrader-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Flask Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algotrader-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: run.py
      FLASK_ENV: development
      FLASK_DEBUG: True
      DATABASE_URL: mysql+mysqldb://algotrader:algotrader@db:3306/algotrader
      SECRET_KEY: dev-secret-key-change-in-production
      JWT_SECRET_KEY: jwt-secret-key-change-in-production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - algotrader-network
    command: python run.py

  # React + Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algotrader-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - algotrader-network
    command: npm run dev

volumes:
  db_data:

networks:
  algotrader-network:
    driver: bridge
